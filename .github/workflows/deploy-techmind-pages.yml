name: Deploy TechMind to GitHub Pages
on:
  # Push trigger removed 2026-11-24: this workflow publishes only top-level files (+growth, aeo-agency),
  # and when it finished after deploy-pages.yml it took /businessloan.space/, /blog/, /news/ and llms.txt offline.
  # deploy-pages.yml (full site) handles push deploys. Run this one manually only if needed.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          mkdir -p _site
          # Publish the existing static homepage and its linked assets/pages.
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.svg' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.gif' -o -name '*.ico' -o -name '*.css' -o -name '*.js' -o -name 'CNAME' -o -name 'robots.txt' -o -name 'sitemap.xml' \) -exec cp {} _site/ \;
          if [ -d growth ]; then cp -R growth _site/growth; fi
          if [ -d aeo-agency ]; then cp -R aeo-agency _site/aeo-agency; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
